<!DOCTYPE html>
<!-- FILE  POSTA HTML STRUTTURA: @POSTA_HTML_NODE -->
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protocolli – CIVILIA_Tb06_PROTOCOLLO</title>

  <!-- Link al CSS -->
  <link rel="stylesheet" href="style.css" />

  <!--
    ==========================================================================================================================
    Tabella riepilogativa dei segnalibri

    | Attività                                 | Segnalibro HTML/JS            | Descrizione / Note
    |------------------------------------------|-------------------------------|----------------------------------------------
    | Titolo pagina                            | #bookmark-titolo              | Visualizza il titolo fisso della pagina
    | Barra di ricerca                         | #bookmark-barra-ricerca       | Input per filtrare i dati in tempo reale
    | Contenitore scrollable                   | #bookmark-scroll              | Contiene la tabella con scroll verticale
    | Tabella dati                             | #bookmark-tabella             | Contiene <thead> e <tbody> per protocolli
    | Intestazioni tabella                     | #bookmark-intestazioni        | Sticky, rimangono visibili durante lo scroll
    | Righe tabella                            | #bookmark-righe               | Generate dinamicamente da script.js
    | Inserimento righe                        | script.js (appendChild)       | Logica JS per appendere le righe
    | Caricamento dati                         | script.js (fetch('/dati'))    | Richiesta dati dal server
    | Gestione errori fetch                    | script.js (.catch(...))       | Gestione errori lato client
    | Funzione render tabella                  | script.js (renderizzaTabella) | Genera righe da JSON
    | Evento input filtro                      | script.js (addEventListener)  | Filtra dati in tempo reale
    | Script logica e filtraggio               | script.js                     | Collegamento relativo
  ==========================================================================================================================
  -->
</head>
<body>
  <!-- Titolo pagina con IP a destra -->
  <h1 id="bookmark-titolo" style="display:flex; justify-content: space-between; align-items: center;">
    Protocolli – CIVILIA_Tb06_PROTOCOLLO
    <span id="master-ip" style="font-size:0.8em; color:#555;"></span> <!-- @bookmark: ip -->
  </h1>

  <!-- Barra di ricerca -->
  <input type="text" id="searchInput" data-bookmark="bookmark-barra-ricerca"
         placeholder="Cerca per Numero, Oggetto o Corrisp...">

  <!-- Contenitore scrollable per intestazioni sticky -->
  <div class="table-container" data-bookmark="bookmark-scroll">
    <!-- Tabella dati protocolli -->
    <table id="tabella-dati" data-bookmark="bookmark-tabella">
      <thead data-bookmark="bookmark-intestazioni">
        <tr>
          <th>NUMERO_PROTOC_lng</th>
          <th>DATA_PROTOC_s</th>
          <th>OGGETTO_m</th>
          <th>CORRISPON_m</th>
          <th>NOTE_s</th>
          <th>IdOrd_lng</th>
        </tr>
      </thead>
      <tbody data-bookmark="bookmark-righe">
        <!-- Righe generate dinamicamente da script.js -->
      </tbody>
    </table>
  </div>

  <!-- Script separato per logica e filtraggio -->
  <script src="script.js" data-bookmark="bookmark-script"></script>
</body>
</html>
